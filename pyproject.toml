[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse_exchange_orderbook_liquidity_analytics"
version = "1.0.0"
description = "Institutional Crypto Derivatives & Order Book Liquidity Data Warehouse: Bid-ask spread slippage, Order Book Imbalance (OBI), maker/taker fees, and liquidation risk thresholds."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
